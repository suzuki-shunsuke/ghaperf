---
name: integration test
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: true
jobs:
  gomodule:
    uses: suzuki-shunsuke/download-go-module-action/.github/workflows/download.yaml@63db944fc861c4f6a4def7af7b0303f221e8bb5e # v0.0.3
    permissions:
      contents: read
      id-token: write
    with:
      artifact_name: gomodule-integration-test
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  integration-test:
    permissions:
      contents: read
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    needs: [gomodule]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules
        uses: suzuki-shunsuke/download-go-module-action/restore@63db944fc861c4f6a4def7af7b0303f221e8bb5e # v0.0.3
        with:
          artifact_name: gomodule-integration-test

      - run: |
          go install -ldflags "-X main.version=0.0.1-0 -X main.commit=$GITHUB_SHA -X main.date=$(date +"%Y-%m-%dT%H:%M:%SZ%:z" | tr -d '+')" ./cmd/ghaperf
      - run: ghaperf -v
      - run: ghaperf -h
      - run: ghaperf --log-file testdata/log.txt --threshold 1s
      - run: |
          run_id=$(gh run list -w test.yaml -s completed -L 1 --json databaseId -q ".[0].databaseId")
          ghaperf --repo "$GITHUB_REPOSITORY" --run-id "$run_id" --threshold 1s
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          ghaperf --repo "$GITHUB_REPOSITORY" --workflow test.yaml --count 10 --threshold 1s
        env:
          GITHUB_TOKEN: ${{ github.token }}
